[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-autopsy"
version = "0.1.0"
description = "A diagnostic and evaluation platform for understanding why RAG systems fail."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "sentence-transformers>=5.7,<6",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
